name: Release Firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Firmware Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi make

      - name: Build custom firmware
        run: |
          make -C firmware
          sha256sum build/firmware/displio-fw.bin > build/firmware/displio-fw.bin.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/firmware/displio-fw.bin \
            build/firmware/displio-fw.bin.sha256 \
            --title "Displio Rebirth ${GITHUB_REF_NAME}" \
            --generate-notes
